name: Java CI with Maven

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build, Test & Coverage

    steps:
      # 1. Checkout del repositorio
      - name: Checkout código fuente
        uses: actions/checkout@v4

      # 2. Configurar JDK 17
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Compilar el proyecto
      - name: Compilar con Maven
        run: mvn clean compile -B

      # 4. Ejecutar todas las pruebas unitarias
      - name: Ejecutar pruebas unitarias
        run: mvn test -B

      # 5. Generar reporte de cobertura JaCoCo
      - name: Generar reporte JaCoCo
        run: mvn jacoco:report -B

      # 6. Subir reporte de cobertura como artefacto descargable
      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 30

      # 7. Subir resultados de pruebas como artefacto
      - name: Subir resultados de pruebas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-test-results
          path: target/surefire-reports/
          retention-days: 30

      # 8. Mostrar resumen de cobertura en el log
      - name: Mostrar resumen de cobertura
        if: always()
        run: |
          echo "===================================="
          echo "  RESUMEN DE COBERTURA JACOCO"
          echo "===================================="
          if [ -f target/site/jacoco/index.html ]; then
            echo "✅ Reporte generado en target/site/jacoco/index.html"
            echo "📁 Disponible como artefacto: jacoco-coverage-report"
          else
            echo "⚠️  Reporte no encontrado"
          fi
